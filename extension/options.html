<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Setu Bridge Settings &amp; In-Browser Logs</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 16px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 16px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #475569;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-danger {
      background: #991b1b;
      border-color: #b91c1c;
    }
    .btn-danger:hover {
      background: #7f1d1d;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .status-active {
      background: #064e3b;
      color: #6ee7b7;
    }
    .status-suspended {
      background: #78350f;
      color: #fde68a;
    }
    .status-disconnected {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      min-width: 250px;
    }
    select.filter-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .log-viewport {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      height: 480px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-row {
      padding: 4px 0;
      border-bottom: 1px solid #0f172a;
      display: flex;
      gap: 12px;
    }
    .log-time {
      color: #64748b;
      flex-shrink: 0;
    }
    .log-level {
      font-weight: 600;
      flex-shrink: 0;
      width: 50px;
    }
    .log-level-INFO { color: #38bdf8; }
    .log-level-WARN { color: #fbbf24; }
    .log-level-ERROR { color: #f87171; }
    .log-msg {
      color: #cbd5e1;
      flex-grow: 1;
    }
    .log-meta {
      color: #94a3b8;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Setu Bridge Settings</h1>
      <span id="bridgeBadge" class="status-badge status-disconnected">Checking Status</span>
    </header>

    <div class="card">
      <h2>Bridge Management</h2>
      <div class="flex-row">
        <button id="toggleBridgeBtn" class="btn btn-primary">Suspend Bridge</button>
        <button id="openGeminiBtn" class="btn">Launch Gemini Tab</button>
        <button id="triggerModelBtn" class="btn">Trigger Best Model Selection</button>
      </div>
    </div>

    <div class="card">
      <h2>In-Browser Append-Only Log File</h2>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 0;">
        IndexedDB persistent storage with automated FIFO eviction (capped at 5,000 records).
      </p>

      <div class="toolbar">
        <div class="flex-row">
          <input type="text" id="searchInput" class="search-input" placeholder="Search log records...">
          <select id="levelFilter" class="filter-select">
            <option value="ALL">All Levels</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>
        <div class="flex-row">
          <button id="refreshLogsBtn" class="btn">Refresh</button>
          <button id="exportLogsBtn" class="btn btn-primary">Export .log File</button>
          <button id="purgeLogsBtn" class="btn btn-danger">Purge Logs</button>
        </div>
      </div>

      <div id="logViewport" class="log-viewport">
        <!-- Rendered log lines -->
      </div>
    </div>
  </div>

  <script src="logger.js"></script>
  <script src="options.js"></script>
</body>
</html>
