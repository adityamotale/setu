[package]
name = "setu_mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mcp-calculator"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
